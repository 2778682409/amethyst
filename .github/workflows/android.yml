name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix broken submodule entries in .gitmodules
        run: |
          if [ -f .gitmodules ]; then
            python3 -c "import configparser, pathlib; p = pathlib.Path('.gitmodules'); cp = configparser.ConfigParser(); cp.read(p); [cp.remove_section(s) for s in list(cp.sections()) if s.startswith('submodule ') and not cp.has_option(s, 'url')]; cp.write(open(p, 'w'))"
          fi
          git submodule update --init --recursive || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums (debug)
        run: md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: out/app-debug.apk
