name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # 先不自动检出子模块，先修复 .gitmodules

      - name: Fix broken submodule entries in .gitmodules
        run: |
          # 移除 .gitmodules 中没有 URL 的子模块条目（如 g14es），防止 git submodule update 失败
          if [ -f .gitmodules ]; then
            git config --remove-section submodule.g14es 2>/dev/null || true
            if grep -q 'submodule "g14es"' .gitmodules 2>/dev/null; then
              awk '
                /^\[submodule "g14es"\]/ { skip=1; next }
                /^\[submodule/ { skip=0 }
                !skip { print }
              ' .gitmodules > .gitmodules.tmp && mv .gitmodules.tmp .gitmodules
            fi
          fi
          git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums (debug)
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*
