name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix broken submodule entries in .gitmodules
        run: |
          # 移除 .gitmodules 中所有没有 url 的子模块条目（如 gl4es），防止 submodule update 失败
          if [ -f .gitmodules ]; then
            python3 - << 'PYEOF'
import configparser, pathlib
p = pathlib.Path('.gitmodules')
if not p.exists():
    raise SystemExit(0)
cp = configparser.ConfigParser()
cp.read(p)
to_remove = []
for section in cp.sections():
    if section.startswith('submodule "') and not cp.has_option(section, 'url'):
        to_remove.append(section)
for section in to_remove:
    cp.remove_section(section)
with open(p, 'w') as f:
    cp.write(f)
print("Removed submodule sections without URL:", to_remove)
PYEOF
          git submodule update --init --recursive || true
        shell: bash

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums (debug)
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*
